<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>小红书博主职业采集</title>
<style>
  :root { --pri:#ff2442; --bg:#f6f7fb; --line:#e6e8ef; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:#1d1d1f; }
  .wrap { max-width:960px; margin:32px auto; padding:0 16px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:#8a8f99; font-size:13px; margin-bottom:20px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  button { border:0; border-radius:8px; padding:10px 20px; font-size:14px; cursor:pointer; transition:.15s; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .start { background:var(--pri); color:#fff; }
  .stop { background:#333; color:#fff; }
  .export { background:#fff; color:#333; border:1px solid var(--line); }
  input[type=number] { width:90px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
  .status { margin-left:auto; font-size:13px; color:#666; max-width:60%; text-align:right; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#bbb; margin-right:6px; vertical-align:middle;}
  .dot.run { background:#1aad19; animation:pulse 1s infinite; }
  .dot.err { background:#ff2442; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:11px 10px; border-bottom:1px solid var(--line); }
  th { color:#8a8f99; font-weight:500; font-size:13px; }
  td.occ { color:var(--pri); font-weight:600; }
  td.rid { font-family:ui-monospace,Consolas,monospace; color:#5a6070; }
  .empty { color:#b0b4bd; text-align:center; padding:32px 0; }
  .foot { margin-top:10px; display:flex; justify-content:flex-end; }
</style>
</head>
<body>
<div class="wrap">
  <h1>小红书博主职业采集</h1>
  <div class="sub">自动采集「主页推荐」中的博主<b>昵称 / 小红书号 / IP属地 / 简介</b>，并推测职业。默认<b>游客模式（免登录）</b>，默认抓取 10 人，速率已放慢以降低风控。<br/><b>行业筛选（可选）</b>：优先进入小红书的<b>行业频道</b>（内容按行业组织、免登录即可用，命中目标职业的概率远高于随机推荐流）；没有频道的行业或自定义关键词则走<b>关键词搜索</b>（需要登录态）。不选行业＝沿用随机推荐流。</div>

  <div class="card">
    <div class="row">
      <button id="btnStart" class="start">开始</button>
      <button id="btnStop" class="stop" disabled>停止</button>
      <span style="color:#666;font-size:14px;">抓取数量</span>
      <input id="count" type="number" min="1" max="300" value="10" />
      <span style="color:#666;font-size:14px;">模式</span>
      <select id="mode" style="padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;">
        <option value="guest" selected>游客模式（免登录，推荐）</option>
        <option value="login">登录模式（扫码登录）</option>
      </select>
      <span class="status"><span id="dot" class="dot"></span><span id="statusText">空闲</span></span>
    </div>
    <div id="modeHint" style="margin-top:10px;font-size:12.5px;color:#8a8f99;line-height:1.6;"></div>
  </div>

  <div class="card">
    <div class="row" style="align-items:baseline;">
      <span style="color:#666;font-size:14px;">行业筛选</span>
      <span style="font-size:12.5px;color:#8a8f99;">点选行业（可多选）＝走行业频道（免登录可用）；不选＝随机推荐流；自定义关键词走搜索（需登录）</span>
    </div>
    <div id="indChips" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;"></div>
    <div class="row" style="margin-top:10px;align-items:center;">
      <input id="customInd" type="text" placeholder="自定义行业/关键词（可选），逗号分隔，例如：露营,咖啡探店,滑雪"
             style="flex:1;min-width:280px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;" />
      <button id="btnClearInd" class="stop" style="padding:8px 14px;">清空行业</button>
      <span id="indState" style="font-size:12.5px;color:#8a8f99;"></span>
    </div>
  </div>

  <div class="card">
    <table>
      <thead><tr><th style="width:20%">昵称</th><th style="width:19%">来源行业/关键词</th><th style="width:12%">小红书号</th><th style="width:9%">IP属地</th><th style="width:25%">推测职业</th><th style="width:15%">置信度</th></tr></thead>
      <tbody id="tbody"><tr><td colspan="5" class="empty">暂无数据</td></tr></tbody>
    </table>
    <div class="foot">
      <button id="btnDemo" class="export">演示数据</button>
      <button id="btnExport" class="export" style="margin-left:8px;">一键导出 (CSV)</button>
      <button id="btnExportXlsx" class="export" style="margin-left:8px;">导出 Excel</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let running = false;

const HINT = {
  guest: "游客模式（免登录）：实测<b>昵称/小红书号/简介/IP属地 全都能拿到</b>——用真实浏览器先逛一遍推荐流种下反爬 Cookie，再取博主主页的 SSR HTML 解析即可。<br>主要风险：<b>风险落在 IP 而非账号</b>，匿名流量更容易被拦成「安全限制」页（脚本已内置识别+退避重试）。单次上限 20，建议 10 个一批、间隔几分钟。",
  login: "登录模式：扫码登录后走签名接口抓取，资料最稳；风险集中在<b>账号</b>（可能被限流），且小红书号等字段一旦改版仍需解析兜底。"
};
function syncHint(){
  const m = $("mode").value;
  $("modeHint").innerHTML = HINT[m] || "";
  $("count").max = (m === "guest") ? 20 : 300;
  if (m === "guest" && parseInt($("count").value||"10",10) > 20) $("count").value = 20;
}
$("mode").onchange = syncHint;
syncHint();

async function api(path, opts) {
  const r = await fetch(path, opts);
  try { return await r.json(); } catch(e){ return {}; }
}

function render(rows) {
  const tb = $("tbody");
  if (!rows || !rows.length) { tb.innerHTML = '<tr><td colspan="6" class="empty">暂无数据</td></tr>'; return; }
  const confColor = { "高":"#1aad19", "中":"#f0a020", "低":"#8a8f99", "无":"#b0b4bd" };
  tb.innerHTML = rows.map(r => {
    const c = r.confidence || "无";
    return `<tr><td>${escapeHtml(r.nickname||"")}</td>` +
    `<td title="${escapeHtml(r.source||"")}">${escapeHtml(r.industry||"-")}</td>` +
    `<td class="rid" title="${escapeHtml(r.note||"")}">${escapeHtml(r.red_id||"-")}</td>` +
    `<td>${escapeHtml(r.ip_location||"-")}</td>` +
    `<td class="occ" title="${escapeHtml(r.evidence||"")}">${escapeHtml(r.occupation||"未识别")}</td>` +
    `<td style="color:${confColor[c]||'#8a8f99'}" title="${escapeHtml(r.category||"")}">${escapeHtml(c)}</td></tr>`;
  }).join("");
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function refresh() {
  const s = await api("/api/status");
  const st = s.state || "idle";
  running = (st === "running" || st === "stopping");
  $("btnStart").disabled = running;
  $("btnStop").disabled = !running;
  const dot = $("dot");
  dot.className = "dot" + (running ? " run" : (st==="error" ? " err" : ""));
  $("statusText").textContent = s.phase || (st === "idle" ? "空闲" : st);
  render(s.results);
}

// ===== 行业筛选（预设由服务端注入；注入失败时为 {}，可用下方输入框手填） =====
const INDUSTRY_PRESETS = /*__INDUSTRY_PRESETS__*/{};
const selectedInd = new Set();

function collectIndustries(){
  const custom = ($("customInd").value || "").split(/[,，、\s]+/).filter(Boolean);
  return [...selectedInd, ...custom];
}
function indChipsPaint(){
  [...$("indChips").children].forEach(el=>{
    const on = selectedInd.has(el.dataset.name);
    el.style.background = on ? "#ff2e4d" : "#fff";
    el.style.color = on ? "#fff" : "#444";
    el.style.borderColor = on ? "#ff2e4d" : "#ececf0";
  });
  const all = collectIndustries();
  $("indState").textContent = all.length
    ? ("已选 " + all.length + " 个关键词：" + all.join("、"))
    : "未选择 → 使用随机推荐流";
}
function buildIndChips(){
  const box = $("indChips");
  box.innerHTML = "";
  const names = Object.keys(INDUSTRY_PRESETS || {});
  if(!names.length){ $("indState").textContent = "行业预设未加载，可在右侧输入框直接填关键词"; return; }
  names.forEach(n=>{
    const el = document.createElement("span");
    el.textContent = n;
    el.dataset.name = n;
    el.style.cssText = "cursor:pointer;padding:5px 12px;border-radius:999px;font-size:13px;border:1px solid #ececf0;background:#fff;color:#444;user-select:none;";
    el.onclick = ()=>{ selectedInd.has(n) ? selectedInd.delete(n) : selectedInd.add(n); indChipsPaint(); };
    box.appendChild(el);
  });
  indChipsPaint();
}
buildIndChips();
$("customInd").addEventListener("input", indChipsPaint);
$("btnClearInd").onclick = ()=>{ selectedInd.clear(); $("customInd").value = ""; indChipsPaint(); };

$("btnStart").onclick = async () => {
  const count = parseInt($("count").value || "10", 10);
  const mode = $("mode").value;
  const industries = collectIndustries();
  const r = await api("/api/start", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({count, mode, industries})});
  if (r.ok === false) alert(r.msg || "启动失败");
  refresh();
};
$("btnStop").onclick = async () => { await api("/api/stop", {method:"POST"}); refresh(); };
$("btnDemo").onclick = async () => { await api("/api/demo", {method:"POST"}); refresh(); };
$("btnExport").onclick = () => { window.location = "/api/export?fmt=csv"; };
$("btnExportXlsx").onclick = () => { window.location = "/api/export?fmt=xlsx"; };

setInterval(refresh, 1500);
refresh();
</script>
</body>
</html>
